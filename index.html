<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viva Cafe — Menü</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F5F1; --card:#FFFFFF; --ink:#1E201C;
    --muted:#7B7D74; --faint:#A8A9A1; --olive:#515A44;
    --rule:#E3E2DB; --rule-soft:#EDECE6;
    --serif:"Newsreader", Georgia, "Times New Roman", serif;
    --sans:"Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#E9E8E2}
  body{color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
  input,textarea,select{font-family:inherit;font-size:16px;color:var(--ink)}
  :focus-visible{outline:1.5px solid var(--olive);outline-offset:2px;border-radius:2px}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

  .app{max-width:480px;margin:0 auto;background:var(--paper);min-height:100vh;position:relative;overflow-x:hidden}
  @media (min-width:520px){ .app{box-shadow:0 0 60px -20px rgba(30,32,28,.22)} }
  .boot{padding:140px 30px;text-align:center;color:var(--faint);font-size:13px}

  .lang{display:inline-flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden;background:rgba(255,255,255,.9);backdrop-filter:blur(8px)}
  .lang button{padding:5px 11px;font-size:11.5px;color:var(--muted);letter-spacing:.06em}
  .lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .lang-float{position:absolute;top:14px;right:14px;z-index:4}

  /* giriş */
  .intro{height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}
  .intro-photo{flex:1 1 auto;min-height:0;width:100%;object-fit:cover;display:block;background:var(--rule-soft)}
  .intro-body{flex:0 0 auto;padding:24px 28px calc(26px + env(safe-area-inset-bottom));text-align:center}
  .intro-body h1{font-family:var(--serif);font-weight:300;font-size:clamp(30px,8vw,40px);line-height:1.04;margin:0 0 9px;letter-spacing:-.014em}
  .intro-body .welcome{margin:0 auto 20px;font-size:13.5px;color:var(--muted);line-height:1.55;max-width:30ch;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .intro-body .hours{margin:14px 0 0;font-size:11.5px;color:var(--faint);letter-spacing:.04em}

  /* kategoriler */
  .masthead{padding:30px 26px 22px;text-align:center;position:relative}
  .masthead h1{font-family:var(--serif);font-weight:300;font-size:34px;line-height:1.05;margin:0 0 8px;letter-spacing:-.012em}
  .masthead p{margin:0;font-size:12px;color:var(--muted);letter-spacing:.03em}
  .masthead-rule{width:30px;height:1px;background:var(--olive);margin:18px auto 0;opacity:.55}
  .home-back{position:absolute;left:18px;top:26px;width:29px;height:29px;display:grid;place-items:center;border:1px solid var(--rule);border-radius:50%;color:var(--ink)}
  .masthead .lang{position:absolute;right:18px;top:24px}

  .cats{padding:0 18px 44px;display:grid;grid-template-columns:1fr 1fr;gap:22px 14px}
  .cat{text-align:left;width:100%;display:block}
  .cat img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;border-radius:3px;background:var(--rule-soft);transition:opacity .2s ease}
  .cat:active img{opacity:.82}
  .cat h2{font-family:var(--serif);font-weight:400;font-size:21px;line-height:1.2;margin:11px 0 2px;letter-spacing:-.005em}
  .cat span{font-size:11.5px;color:var(--faint);letter-spacing:.02em}
  .cats-empty{grid-column:1/-1;padding:50px 10px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.7}

  /* ürünler */
  .subbar{position:sticky;top:0;z-index:5;background:rgba(246,245,241,.94);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--rule-soft);padding:15px 18px;display:flex;align-items:center;gap:13px}
  .back{width:29px;height:29px;display:grid;place-items:center;border:1px solid var(--rule);border-radius:50%;flex-shrink:0;color:var(--ink)}
  .subbar .ttl{flex:1;min-width:0}
  .subbar h2{font-family:var(--serif);font-weight:400;font-size:22px;margin:0;line-height:1.1;letter-spacing:-.005em}
  .subbar .crumb{display:block;font-size:10px;color:var(--faint);letter-spacing:.09em;margin-bottom:3px}
  .items{padding:4px 18px 44px}
  .item{display:flex;gap:16px;padding:20px 0;width:100%;text-align:left;align-items:flex-start;border-bottom:1px solid var(--rule-soft)}
  .item:last-child{border-bottom:none}
  .item-body{flex:1;min-width:0}
  .item-body h3{font-family:var(--serif);font-weight:400;font-size:20px;line-height:1.22;margin:0 0 5px;letter-spacing:-.005em}
  .item-body p{margin:0 0 8px;font-size:13px;color:var(--muted);line-height:1.55;max-width:34ch;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .item-foot{display:flex;align-items:center;gap:9px}
  .item-price{font-size:13px;color:var(--olive);letter-spacing:.02em}
  .item-alg{display:flex;gap:5px;color:var(--faint)}
  .item-alg svg{width:13px;height:13px}
  .item-thumb{width:80px;height:80px;object-fit:cover;border-radius:3px;flex-shrink:0;background:var(--rule-soft)}
  .grp-title{font-family:var(--serif);font-size:16px;color:var(--muted);letter-spacing:.01em;
    padding:24px 0 6px;border-bottom:1px solid var(--rule)}

  /* detay */
  .sheet-wrap{position:fixed;inset:0;z-index:40;display:none}
  .sheet-wrap.open{display:block}
  .sheet-bg{position:absolute;inset:0;background:rgba(30,32,28,.34);animation:fade .2s ease}
  .sheet{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;max-height:90vh;
    background:var(--card);border-radius:16px 16px 0 0;overflow-y:auto;animation:rise .28s cubic-bezier(.22,.8,.3,1)}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{transform:translate(-50%,20%)}to{transform:translate(-50%,0)}}
  .sheet-photo{width:100%;height:252px;object-fit:cover;display:block;background:var(--rule-soft)}
  .sheet-close{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;
    background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--ink);box-shadow:0 2px 10px rgba(30,32,28,.14)}
  .sheet-body{padding:26px 26px calc(36px + env(safe-area-inset-bottom))}
  .sheet-body h3{font-family:var(--serif);font-weight:300;font-size:31px;line-height:1.1;margin:0 0 7px;letter-spacing:-.015em}
  .sheet-price{color:var(--olive);font-size:14px;margin:0 0 20px;letter-spacing:.02em}
  .sheet-body .desc{font-size:14.5px;color:#54564E;line-height:1.65;margin:0 0 26px;max-width:38ch}
  .allergens{border-top:1px solid var(--rule);padding-top:16px}
  .allergens p{margin:0 0 11px;font-size:11.5px;color:var(--faint);letter-spacing:.02em}
  .alg-list{display:flex;flex-wrap:wrap;gap:8px}
  .alg-item{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink);
    border:1px solid var(--rule);border-radius:999px;padding:6px 12px 6px 10px}
  .alg-item svg{width:15px;height:15px;color:var(--olive);flex-shrink:0}
  .alg-none{font-size:13.5px;color:var(--muted)}

  /* panel */
  .adm-top{padding:24px 22px 18px;background:var(--card);border-bottom:1px solid var(--rule);display:flex;align-items:flex-start;gap:12px}
  .adm-top h2{font-family:var(--serif);font-weight:400;font-size:24px;margin:0 0 3px;letter-spacing:-.008em}
  .adm-top p{margin:0;font-size:12.5px;color:var(--muted)}
  .adm-top .grow{flex:1;min-width:0}
  .tabs{display:flex;gap:2px;padding:0 16px;background:var(--card);border-bottom:1px solid var(--rule);overflow-x:auto}
  .tabs button{padding:13px 12px;font-size:13.5px;color:var(--muted);white-space:nowrap;border-bottom:1.5px solid transparent;margin-bottom:-1px}
  .tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--olive)}
  .panel{padding:22px 20px 60px}

  .field{margin-bottom:17px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px;letter-spacing:.02em}
  .field input[type=text],.field input[type=number],.field input[type=email],.field input[type=password],.field textarea,.field select{
    width:100%;background:var(--card);border:1px solid var(--rule);border-radius:7px;padding:11px 12px}
  .field select:disabled{color:var(--faint);background:var(--rule-soft)}
  .field textarea{min-height:76px;resize:vertical;line-height:1.55}
  .field input::placeholder,.field textarea::placeholder{color:var(--faint)}
  .field .hint{font-size:11.5px;color:var(--faint);margin:6px 0 0;line-height:1.5}
  .row{display:flex;gap:10px}
  .row>*{flex:1;min-width:0}
  .flag{display:inline-block;font-size:10.5px;letter-spacing:.08em;color:var(--faint);
    border:1px solid var(--rule);border-radius:3px;padding:1px 5px;margin-right:7px;vertical-align:1px}

  .drop{display:flex;align-items:center;gap:14px;padding:14px;cursor:pointer;background:var(--card);border:1px solid var(--rule);border-radius:7px}
  .drop:hover{border-color:var(--olive)}
  .drop img{width:60px;height:60px;border-radius:4px;object-fit:cover;background:var(--rule-soft);flex-shrink:0}
  .drop-txt{font-size:12.5px;color:var(--muted);line-height:1.5}
  .drop input{display:none}

  .btn{background:var(--ink);color:var(--paper);border-radius:7px;padding:13px 18px;font-weight:500;font-size:14px;width:100%}
  .btn:active{opacity:.86}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--rule);font-weight:400}
  .btn.quiet{background:none;color:var(--muted);border:1px solid var(--rule);font-weight:400;font-size:13px;padding:11px 16px}
  .btn-row{display:flex;gap:9px;margin-top:6px}
  .logout{font-size:12px;color:var(--muted);border:1px solid var(--rule);border-radius:6px;padding:6px 10px;flex-shrink:0}

  .list{display:flex;flex-direction:column;margin-bottom:8px;background:var(--card);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
  .list-row{display:flex;align-items:center;gap:10px;padding:10px 11px;border-bottom:1px solid var(--rule-soft)}
  .list-row:last-child{border-bottom:none}
  .list-row.kid{background:#FCFCFA}
  .list-row.kid .tree{width:13px;flex-shrink:0;color:var(--faint);display:grid;place-items:center}
  .list-row img{width:42px;height:42px;border-radius:4px;object-fit:cover;flex-shrink:0;background:var(--rule-soft)}
  .list-row .meta{flex:1;min-width:0}
  .list-row .meta strong{display:block;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .list-row .meta small{font-size:11.5px;color:var(--muted)}
  .list-row .warn{color:#B4714F}
  .icon-btn{width:28px;height:28px;display:grid;place-items:center;border-radius:6px;color:var(--faint);flex-shrink:0}
  .icon-btn:hover{background:var(--paper);color:var(--ink)}
  .arrows{display:flex;flex-direction:column;gap:1px;flex-shrink:0}
  .arrows button{width:24px;height:17px;display:grid;place-items:center;color:var(--faint);border-radius:4px}
  .arrows button:hover:not(:disabled){background:var(--paper);color:var(--olive)}
  .arrows button:disabled{opacity:.2;cursor:default}
  .sec-title{font-size:12px;color:var(--faint);margin:0 0 11px;letter-spacing:.03em}
  .grp-label{font-size:12px;color:var(--olive);margin:20px 0 8px;letter-spacing:.02em}
  .hr{height:1px;background:var(--rule);margin:26px 0}
  .empty{font-size:13px;color:var(--faint);padding:16px 0;margin:0}

  .alg-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .alg-grid label{display:flex;align-items:center;gap:9px;font-size:13px;padding:10px 11px;border-radius:7px;
    border:1px solid var(--rule);cursor:pointer;color:var(--muted);background:var(--card)}
  .alg-grid label svg{width:17px;height:17px;flex-shrink:0;color:var(--faint)}
  .alg-grid input{display:none}
  .alg-grid label:has(input:checked){background:var(--olive);border-color:var(--olive);color:#F6F5F1}
  .alg-grid label:has(input:checked) svg{color:#F6F5F1}

  .qr-box{text-align:center;padding:4px 0 0}
  .qr-box canvas,.qr-box .qr-fallback{background:var(--card);padding:16px;border-radius:8px;display:inline-block;border:1px solid var(--rule)}
  .qr-fallback{font-size:12px;max-width:200px;line-height:1.5;color:var(--muted)}
  .qr-link{margin:18px 0 8px;font-size:13px;color:var(--olive);word-break:break-all}
  .qr-help{font-size:12.5px;color:var(--muted);line-height:1.65;text-align:left;margin-top:24px}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:80;background:var(--ink);color:var(--paper);
    padding:11px 20px;border-radius:999px;font-size:13.5px;font-weight:500;opacity:0;pointer-events:none;
    transition:opacity .22s, bottom .22s;max-width:88vw;text-align:center}
  .toast.show{opacity:1;bottom:34px}

  .lock{padding:80px 30px;text-align:center;min-height:100vh}
  .lock h2{font-family:var(--serif);font-weight:300;font-size:28px;margin:0 0 10px;letter-spacing:-.01em}
  .lock p{font-size:13px;color:var(--muted);margin:0 0 26px;line-height:1.6}
  .lock .field{text-align:left;max-width:300px;margin:0 auto 14px}
  .lock .btn{max-width:300px;margin:6px auto 0}
  .lock .sm{font-size:12px;color:var(--faint);margin-top:22px}
</style>
</head>

function toast(m,ms=2300){
  const el=document.getElementById("toast");
  el.textContent=m; el.classList.add("show");
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("show"),ms);
}

/* ---------- ağaç yardımcıları ---------- */
const par       = c => (c && c.parent) || null;
const cat       = id => data.categories.find(c=>c.id===id);
const topCats   = () => data.categories.filter(c=>!par(c));
const kidsOf    = id => data.categories.filter(c=>par(c)===id);
const itemsOf   = id => data.items.filter(i=>i.cat===id);
const deepCount = id => itemsOf(id).length + kidsOf(id).reduce((n,k)=>n+itemsOf(k.id).length,0);
function catPath(id){
  const c=cat(id); if(!c) return "";
  const p=par(c)?cat(par(c)):null;
  return p ? `${tx(p.name)} › ${tx(c.name)}` : tx(c.name);
}

const headers = (extra={}) => Object.assign({
  apikey: SUPA_KEY, Authorization: "Bearer " + (token||SUPA_KEY)
}, extra);

function normalize(d){
  d.categories = d.categories || [];
  d.items = d.items || [];
  d.categories.forEach(c=>{ if(c.parent===undefined) c.parent=null; });
  return d;
}

async function dbLoad(){
  const r = await fetch(`${SUPA_URL}/rest/v1/menu?id=eq.${ROW_ID}&select=data`, {headers: headers()});
  if(!r.ok) throw new Error("okunamadi");
  const rows = await r.json();
  if(rows.length && rows[0].data){ data=normalize(rows[0].data); fromDb=true; }
  else { data=normalize(JSON.parse(JSON.stringify(TEMPLATE))); fromDb=false; }
}
async function dbSave(msg){
  if(!token){ toast("Önce panele giriş yapmalısın"); return false; }
  saving=true; render();
  try{
    const r = await fetch(`${SUPA_URL}/rest/v1/menu`, {
      method:"POST",
      headers: headers({ "Content-Type":"application/json", Prefer:"resolution=merge-duplicates" }),
      body: JSON.stringify([{ id:ROW_ID, owner:userId, data }])
    });
    if(!r.ok) throw new Error(await r.text());
    fromDb=true; if(msg) toast(msg); return true;
  }catch(e){
    toast("Kaydedilemedi. Oturumun düşmüş olabilir, çıkıp tekrar gir.",3600); return false;
  }finally{ saving=false; render(); }
}
async function login(email,pass){
  const r = await fetch(`${SUPA_URL}/auth/v1/token?grant_type=password`, {
    method:"POST", headers:{ apikey:SUPA_KEY, "Content-Type":"application/json" },
    body: JSON.stringify({ email, password:pass })
  });
  if(!r.ok) return false;
  const j = await r.json();
  token  = j.access_token;
  userId = j.user && j.user.id;
  return true;
}

function uploadPhoto(file,done){
  if(!file) return;
  if(!token){ toast("Fotoğraf yüklemek için giriş gerekiyor"); return; }
  toast("Fotoğraf yükleniyor…",9000);
  const fr=new FileReader();
  fr.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const max=1400; let w=img.width,h=img.height;
      if(Math.max(w,h)>max){const s=max/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      cv.toBlob(async blob=>{
        const path=`${Date.now()}-${uid()}.jpg`;
        try{
          const r=await fetch(`${SUPA_URL}/storage/v1/object/${BUCKET}/${path}`,{
            method:"POST", headers: headers({ "Content-Type":"image/jpeg" }), body: blob });
          if(!r.ok) throw new Error(await r.text());
          toast("Fotoğraf yüklendi");
          done(`${SUPA_URL}/storage/v1/object/public/${BUCKET}/${path}`);
        }catch(e){ toast("Fotoğraf yüklenemedi",3200); }
      },"image/jpeg",.8);
    };
    img.onerror=()=>toast("Bu dosya okunamadı");
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}

function onRestoreFile(el){
  const f=el.files[0]; el.value="";
  if(!f) return;
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const p=JSON.parse(fr.result);
      if(!p||!p.venue||!Array.isArray(p.categories)||!Array.isArray(p.items))
        return toast("Bu dosya menü yedeği değil",3200);
      if(!confirm(`Yedekteki menü yüklenecek: ${p.categories.length} kategori, ${p.items.length} ürün. Şu anki menünün üzerine yazılacak. Emin misin?`)) return;
      data=normalize(p); editingItem=null; editingCat=null;
      render(); toast("Yedek yüklendi, kaydetmeyi unutma",3200);
    }catch(e){ toast("Dosya okunamadı",3000); }
  };
  fr.readAsText(f);
}

  const bar=`<div class="subbar">

  if(!kids.length) return bar + `<div class="items">${itemRows(own)}</div>`;

  const extra = own.length
    ? `<div class="items"><div class="grp-title">${t("others")}</div>${itemRows(own)}</div>`
    : "";
  return bar + `<div class="cats" style="padding-top:18px">${cards}</div>` + extra;

function swapAt(arr,a,b){ const t=arr[a]; arr[a]=arr[b]; arr[b]=t; }

function moveCat(id,dir){
  const c=cat(id); if(!c) return;
  const sibs=data.categories.filter(x=>par(x)===par(c));
  const i=sibs.indexOf(c), j=i+dir;
  if(j<0||j>=sibs.length) return;
  swapAt(data.categories, data.categories.indexOf(sibs[i]), data.categories.indexOf(sibs[j]));
  dbSave("Sıra değişti");
}
function moveItem(id,dir){
  const it=data.items.find(x=>x.id===id); if(!it) return;
  const sibs=data.items.filter(x=>x.cat===it.cat);
  const i=sibs.indexOf(it), j=i+dir;
  if(j<0||j>=sibs.length) return;
  swapAt(data.items, data.items.indexOf(sibs[i]), data.items.indexOf(sibs[j]));
  dbSave("Sıra değişti");
}
function arrows(fn,id,first,last){

    <button onclick="${fn}('${id}',-1)" ${first?"disabled":""} aria-label="Yukarı taşı">${SVG_UP}</button>

}

        <input type="file" accept="image/*" onchange="onVenueCover(this)">
      </label></div>
    <button class="btn" ${saving?"disabled":""} onclick="saveVenue()">${saveLabel("Kaydet ve yayınla")}</button>
    <div class="hr"></div>
    <p class="sec-title">Baştan başla</p>
    <button class="btn quiet" onclick="resetTemplate()">Taslak menüyü geri yükle</button>
    <p class="hint">Menüyü örnek haline döndürür. Kaydedene kadar yayına yansımaz.</p>`;
}
function onVenueCover(el){ uploadPhoto(el.files[0], url=>{ data.venue.cover=url; render(); }); }
function saveVenue(){
  const g=id=>document.getElementById(id).value.trim();
  data.venue.name=g("vName")||"Mekan adı";
  data.venue.tagline={tr:g("vTagTr"),en:g("vTagEn")};
  data.venue.welcome={tr:g("vWelTr"),en:g("vWelEn")};
  dbSave("Yayınlandı");
}
function resetTemplate(){
  if(!confirm("Menü örnek haline dönecek. Emin misin?")) return;
  data=normalize(JSON.parse(JSON.stringify(TEMPLATE)));
  editingItem=null; editingCat=null; render(); toast("Taslak yüklendi, kaydetmeyi unutma");
}

/* ---------- kategoriler ---------- */
function catRow(c,first,last,isKid){
  const p=pair(c.name);
  const kids=kidsOf(c.id).length;
  const meta = isKid ? `${itemsOf(c.id).length} ürün`
             : (kids ? `${kids} alt bölüm · ${deepCount(c.id)} ürün`
                     : `${itemsOf(c.id).length} ürün`);
  return `<div class="list-row${isKid?" kid":""}">
    ${arrows("moveCat",c.id,first,last)}
    ${isKid?`<span class="tree">${SVG_TREE}</span>`:""}
    <img src="${esc(c.photo)}" alt="">
    <div class="meta"><strong>${esc(p.tr)}</strong>
      <small>${meta}${p.en?"":` · <span class="warn">EN yok</span>`}</small></div>
    <button class="icon-btn" onclick="editCat('${c.id}')" aria-label="Düzenle">${SVG_EDIT}</button>
    <button class="icon-btn" onclick="delCat('${c.id}')" aria-label="Sil">${SVG_DEL}</button>
  </div>`;
}

function panelCats(){
  const tops=topCats();
  let rows="";
  tops.forEach((c,ci)=>{
    rows += catRow(c, ci===0, ci===tops.length-1, false);
    const kids=kidsOf(c.id);
    kids.forEach((k,ki)=>{ rows += catRow(k, ki===0, ki===kids.length-1, true); });
  });

  const c = editingCat ? cat(editingCat) : null;
  const n = pair(c?c.name:null);
  const hasKids = c ? kidsOf(c.id).length>0 : false;

  const parentOpts = [`<option value="">— Ana kategori —</option>`].concat(
    topCats().filter(x=>!c||x.id!==c.id).map(x=>
      `<option value="${x.id}" ${c&&par(c)===x.id?"selected":""}>${esc(pair(x.name).tr)}</option>`)
  ).join("");

  return `
    <p class="sec-title">Menü yapısı — oklarla sırayı değiştir</p>
    ${rows?`<div class="list">${rows}</div>`:`<p class="empty">Henüz kategori yok.</p>`}
    <p class="hint">Girintili olanlar alt bölüm. Oklar kategoriyi kendi grubu içinde yukarı aşağı taşır. Bir bölümü başka bir ana kategorinin altına taşımak için kalem işaretine bas, aşağıdaki “Üst kategori” alanını değiştir.</p>
    <div class="hr"></div>
    <p class="sec-title">${c?"Kategoriyi düzenle":"Yeni kategori"}</p>
    <div class="field"><label for="cNameTr"><span class="flag">TR</span>Adı</label>
      <input type="text" id="cNameTr" value="${c?esc(n.tr):""}" placeholder="Kahve, Tatlı, Kahvaltı…"></div>
    <div class="field"><label for="cNameEn"><span class="flag">EN</span>Adı</label>
      <input type="text" id="cNameEn" value="${c?esc(n.en):""}" placeholder="Coffee, Desserts, Breakfast…"></div>
    <div class="field"><label for="cParent">Üst kategori</label>
      <select id="cParent" ${hasKids?"disabled":""}>${parentOpts}</select>
      <p class="hint">${hasKids
        ? "Bu kategorinin altında bölümler var, o yüzden kendisi başka bir kategorinin içine taşınamıyor. Önce alt bölümlerini başka yere taşı."
        : "Boş bırakırsan ana kategori olur, menünün ilk ekranında görünür. Bir kategori seçersen onun içine girer."}</p></div>
    <div class="field"><label>Kategori fotoğrafı</label>
      <label class="drop">
        <img src="${c?esc(c.photo):(catDraftPhoto||ph("bos",200,200))}" alt="">
        <span class="drop-txt">Seçmek için dokun<br>Dikey fotoğraf en iyi durur</span>
        <input type="file" accept="image/*" onchange="onCatPhoto(this)">
      </label></div>
    <div class="btn-row">
      <button class="btn" ${saving?"disabled":""} onclick="saveCat()">${saveLabel(c?"Kaydet ve yayınla":"Ekle ve yayınla")}</button>
      ${c?`<button class="btn ghost" onclick="setTab('cats')">Vazgeç</button>`:""}
    </div>`;
}
function onCatPhoto(el){ uploadPhoto(el.files[0], url=>{ catDraftPhoto=url; if(editingCat){ cat(editingCat).photo=url; } render(); }); }
function editCat(id){ editingCat=id; catDraftPhoto=null; adminTab="cats"; render(); window.scrollTo(0,document.body.scrollHeight); }
function delCat(id){
  const c=cat(id); if(!c) return;
  const kids=kidsOf(id), n=deepCount(id);
  const msg = kids.length
    ? `“${pair(c.name).tr}” ve altındaki ${kids.length} bölüm ile ${n} ürün silinecek. Emin misin?`
    : (n ? `Bu kategori ve içindeki ${n} ürün silinecek. Emin misin?` : "Kategori silinecek. Emin misin?");
  if(!confirm(msg)) return;
  const doomed=[id, ...kids.map(k=>k.id)];
  data.categories=data.categories.filter(x=>!doomed.includes(x.id));
  data.items=data.items.filter(i=>!doomed.includes(i.cat));
  editingCat=null; dbSave("Silindi");
}
function saveCat(){
  const tr=document.getElementById("cNameTr").value.trim();
  const en=document.getElementById("cNameEn").value.trim();
  const sel=document.getElementById("cParent");
  if(!tr) return toast("Türkçe kategori adı gerekli");
  if(editingCat){
    const c=cat(editingCat);
    const parent = sel && !sel.disabled ? (sel.value||null) : par(c);
    if(parent===c.id) return toast("Bir kategori kendi altına taşınamaz");
    c.name={tr,en}; c.parent=parent;
    if(catDraftPhoto) c.photo=catDraftPhoto;
  }else{
    const parent = sel ? (sel.value||null) : null;
    data.categories.push({id:uid(),parent,name:{tr,en},photo:catDraftPhoto||ph(uid(),600,750)});
  }
  editingCat=null; catDraftPhoto=null; dbSave("Yayınlandı");
}

/* ---------- ürünler ---------- */
function panelItems(){
  if(!data.categories.length)
    return `<p class="empty">Ürün eklemek için önce bir kategori oluştur.</p>
            <button class="btn ghost" onclick="setTab('cats')">Kategorilere git</button>`;

  let rows="";
  const group = c => {
    const list=itemsOf(c.id);
    if(!list.length) return;
    rows += `<p class="grp-label">${esc(catPath(c.id))}</p><div class="list">`;
    list.forEach((i,ix)=>{
      const nm=pair(i.name);
      rows += `<div class="list-row">
        ${arrows("moveItem",i.id,ix===0,ix===list.length-1)}
        <img src="${esc(i.photo)}" alt="">
        <div class="meta"><strong>${esc(nm.tr)}</strong>
          <small>${esc(i.price)} ₺${nm.en?"":` · <span class="warn">EN yok</span>`}</small></div>
        <button class="icon-btn" onclick="editItem('${i.id}')" aria-label="Düzenle">${SVG_EDIT}</button>
        <button class="icon-btn" onclick="delItem('${i.id}')" aria-label="Sil">${SVG_DEL}</button>
      </div>`;
    });
    rows += `</div>`;
  };
  topCats().forEach(c=>{ group(c); kidsOf(c.id).forEach(group); });

  const it = editingItem ? data.items.find(x=>x.id===editingItem) : null;
  const nm = pair(it?it.name:null), ds = pair(it?it.desc:null);

  let opts="";
  topCats().forEach(c=>{
    opts += `<option value="${c.id}" ${it&&it.cat===c.id?"selected":""}>${esc(pair(c.name).tr)}</option>`;
    kidsOf(c.id).forEach(k=>{
      opts += `<option value="${k.id}" ${it&&it.cat===k.id?"selected":""}>&nbsp;&nbsp;&#8250; ${esc(pair(k.name).tr)}</option>`;
    });
  });

  const algBoxes=ALG_KEYS.map(k=>`
    <label><input type="checkbox" name="alg" value="${k}" ${it&&(it.allergens||[]).includes(k)?"checked":""}>
      ${algSvg(k)}<span>${ALG[k].tr}</span></label>`).join("");

  return `
    <p class="sec-title">Ürünler — oklarla sırayı değiştir</p>
    ${rows || `<p class="empty">Henüz ürün yok.</p>`}
    <div class="hr"></div>
    <p class="sec-title">${it?"Ürünü düzenle":"Yeni ürün"}</p>
    <div class="field"><label for="iNameTr"><span class="flag">TR</span>Ürün adı</label>
      <input type="text" id="iNameTr" value="${it?esc(nm.tr):""}" placeholder="Flat white"></div>
    <div class="field"><label for="iNameEn"><span class="flag">EN</span>Ürün adı</label>
      <input type="text" id="iNameEn" value="${it?esc(nm.en):""}" placeholder="Flat white"></div>
    <div class="row">
      <div class="field"><label for="iCat">Bölüm</label><select id="iCat">${opts}</select></div>
      <div class="field"><label for="iPrice">Fiyat (₺)</label>
        <input type="number" id="iPrice" value="${it?esc(it.price):""}" placeholder="95"></div>
    </div>
    <div class="field"><label for="iDescTr"><span class="flag">TR</span>Açıklama</label>
      <textarea id="iDescTr" placeholder="Müşteri ürüne dokunduğunda bunu görecek.">${it?esc(ds.tr):""}</textarea></div>
    <div class="field"><label for="iDescEn"><span class="flag">EN</span>Açıklama</label>
      <textarea id="iDescEn" placeholder="Shown when the guest taps the item.">${it?esc(ds.en):""}</textarea></div>
    <div class="field"><label>Fotoğraf</label>
      <label class="drop">
        <img src="${it?esc(it.photo):(itemDraftPhoto||ph("bosurun",200,200))}" alt="">
        <span class="drop-txt">Seçmek için dokun<br>Kare fotoğraf en iyi durur</span>
        <input type="file" accept="image/*" onchange="onItemPhoto(this)">
      </label></div>
    <div class="field"><label>Alerjenler</label>
      <div class="alg-grid">${algBoxes}</div>
      <p class="hint">Seçtiklerin ürün sayfasında ikonlarıyla ve müşterinin diliyle görünür.</p></div>
    <div class="btn-row">
      <button class="btn" ${saving?"disabled":""} onclick="saveItem()">${saveLabel(it?"Kaydet ve yayınla":"Ekle ve yayınla")}</button>
      ${it?`<button class="btn ghost" onclick="setTab('items')">Vazgeç</button>`:""}
    </div>`;
}
function onItemPhoto(el){ uploadPhoto(el.files[0], url=>{ itemDraftPhoto=url; if(editingItem){ data.items.find(x=>x.id===editingItem).photo=url; } render(); }); }
function editItem(id){ editingItem=id; itemDraftPhoto=null; adminTab="items"; render(); window.scrollTo(0,document.body.scrollHeight); }
function delItem(id){
  if(!confirm("Ürün silinecek. Emin misin?")) return;
  data.items=data.items.filter(i=>i.id!==id);
  editingItem=null; dbSave("Silindi");
}
function saveItem(){
  const g=id=>document.getElementById(id).value.trim();
  const nameTr=g("iNameTr"), price=g("iPrice");
  if(!nameTr) return toast("Türkçe ürün adı gerekli");
  if(!price) return toast("Fiyat gerekli");
  const payload={
    cat:document.getElementById("iCat").value,
    name:{tr:nameTr,en:g("iNameEn")},
    desc:{tr:g("iDescTr"),en:g("iDescEn")},
    price,
    allergens:[...document.querySelectorAll('input[name=alg]:checked')].map(x=>x.value)
  };
  if(editingItem){
    const i=data.items.find(x=>x.id===editingItem);
    Object.assign(i,payload);
    if(itemDraftPhoto) i.photo=itemDraftPhoto;
  }else{
    data.items.push({id:uid(),...payload,photo:itemDraftPhoto||ph(uid(),600,600)});
  }
  editingItem=null; itemDraftPhoto=null; dbSave("Yayınlandı");
}

function panelBackup(){
  const tops=topCats().length, subs=data.categories.length-tops;
  return `
    <p class="sec-title">Yedek al</p>
    <p class="hint" style="margin:0 0 12px">Şu anki menü: ${tops} ana kategori, ${subs} alt bölüm, ${data.items.length} ürün. Tek dosya olarak cihazına iner.</p>
    <button class="btn" onclick="backupNow()">Yedeği indir</button>
    <div class="hr"></div>
    <p class="sec-title">Yedeği geri yükle</p>
    <p class="hint" style="margin:0 0 12px">Daha önce indirdiğin yedek dosyasını seç. Menü o haline döner, sonra kaydetmen gerekiyor.</p>
    <button class="btn ghost" onclick="pickRestore()">Yedek dosyası seç</button>
    <div class="hr"></div>
    <p class="hint">Yedek yazıları, fiyatları, menü yapısını ve sırayı taşıyor. Fotoğrafların kendisini değil, adreslerini tutuyor — fotoğrafları ayrıca kendi cihazında da sakla.</p>`;
}

function panelQR(){
  const url=location.origin+location.pathname;
  setTimeout(()=>{
    const holder=document.getElementById("qrHolder");
    if(!holder) return;
    if(typeof QRious!=="undefined"){
      const cv=document.createElement("canvas"); holder.appendChild(cv);
      new QRious({element:cv,value:url,size:200,background:"#FFFFFF",foreground:"#1E201C",level:"H"});
      holder._cv=cv;
    }else{
      holder.innerHTML=`<div class="qr-fallback">Karekod üretilemedi. İnternet bağlantını kontrol et.</div>`;
    }
  },0);
  return `
    <div class="qr-box">
      <div id="qrHolder"></div>
      <p class="qr-link">${esc(url)}</p>
      <button class="btn ghost" onclick="downloadQR()">Karekodu indir</button>
    </div>
    <p class="qr-help">Karekod menünün yayındaki adresini taşıyor. Müşteri hangi dili seçerse o dilde geziyor. Menüyü sonradan değiştirmen karekodu etkilemiyor.</p>`;
}
function downloadQR(){
  const h=document.getElementById("qrHolder");
  if(!h||!h._cv) return toast("Karekod hazır değil");
  const a=document.createElement("a");
  a.href=h._cv.toDataURL("image/png"); a.download="karekod.png"; a.click();
}

function render(){
  const app=document.getElementById("app");
  if(!data){ app.innerHTML=`<div class="boot">Menü yükleniyor…</div>`; return; }
  if(isPanel()){
    app.innerHTML = token ? adminShell(
      adminTab==="venue"?panelVenue():
      adminTab==="cats"?panelCats():
      adminTab==="items"?panelItems():
      adminTab==="backup"?panelBackup():panelQR()
    ) : adminLock();
  }else{
    app.innerHTML = stage==="intro" ? guestIntro()
                  : subOpen ? guestSub()
                  : catOpen ? guestCat()
                  : guestHome();
  }
}
window.addEventListener("hashchange", ()=>{ closeItem(); stage="intro"; catOpen=null; subOpen=null; render(); });

(async function boot(){
  try{ await dbLoad(); }
  catch(e){
    data=normalize(JSON.parse(JSON.stringify(TEMPLATE)));
    toast("Menü sunucudan okunamadı, örnek menü gösteriliyor.",4000);
  }
  render();
})();
</script>
</body>
</html>
